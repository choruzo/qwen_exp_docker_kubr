name: docker-k8s-finetune

services:
  train:
    image: unsloth/unsloth@sha256:f21629b9ae4ed11231768edfaed0f40d41d85d6ea9a71e8096a3d96ea0311772
    platform: linux/amd64
    working_dir: /workspace/project
    init: true
    shm_size: "8gb"
    environment:
      PYTHONPATH: /workspace/project/src
      HF_HOME: /workspace/cache/huggingface
      TRANSFORMERS_CACHE: /workspace/cache/huggingface
      TOKENIZERS_PARALLELISM: "false"
      SYNTHETIC_LLM_BASE_URL: ${SYNTHETIC_LLM_BASE_URL:-}
      SYNTHETIC_LLM_API_KEY: ${SYNTHETIC_LLM_API_KEY:-}
      SYNTHETIC_LLM_MODEL: ${SYNTHETIC_LLM_MODEL:-}
      JUDGE_LLM_BASE_URL: ${JUDGE_LLM_BASE_URL:-}
      JUDGE_LLM_API_KEY: ${JUDGE_LLM_API_KEY:-}
      JUDGE_LLM_MODEL: ${JUDGE_LLM_MODEL:-}
      GGUF_LLM_BASE_URL: ${GGUF_LLM_BASE_URL:-}
      GGUF_LLM_API_KEY: ${GGUF_LLM_API_KEY:-}
      GGUF_LLM_MODEL: ${GGUF_LLM_MODEL:-}
    volumes:
      - .:/workspace/project
      - hf-cache:/workspace/cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: ["python", "-m", "docker_k8s_finetune.cli", "train"]

volumes:
  hf-cache:

version: 1
seed: 3407
inputs:
  - data/interim/normalized/direct_chatml.jsonl
  - data/interim/normalized/reverse_generated_full.jsonl
allow_missing_inputs: true

exact:
  output: data/interim/deduplicated/exact.jsonl
  duplicates: data/quarantine/exact_duplicates.jsonl
  report: data/interim/reports/exact_dedupe_report.json

approximate:

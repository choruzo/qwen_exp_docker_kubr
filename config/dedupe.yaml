  model_revision: 4328cf26390c98c5e3c738b4460a05b95f4911f5
  device: auto
  threshold: 0.92
  top_k: 50
  batch_size: 64
  hnsw_m: 32
  hnsw_ef_construction: 200
  hnsw_ef_search: 128
  output: data/interim/deduplicated/chatml.jsonl
  embeddings: data/interim/deduplicated/semantic_embeddings.npz
  duplicates: data/quarantine/approximate_duplicates.jsonl
  report: data/interim/reports/approximate_dedupe_report.json
  source_tiers:
    docker_docs: 1
    kubernetes_docs: 1
    helm_docs: 1
    cert_manager_docs: 1
    istio_docs: 1
    containerd_docs: 1
    argocd_docs: 1
    ingress_nginx_docs: 1
    coredns_docs: 1
    k8s_instructions: 2
    docker_nl_commands: 2
    kubernetes_stackoverflow_questions: 2
    stackoverflow_docker: 2
    github_resolved_issues: 2
    stack_yaml_k8s: 3
